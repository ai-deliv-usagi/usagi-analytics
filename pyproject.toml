[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usagi-analytics"
version = "0.1.0"
description = "TikTok Display API batch analytics for @ai_deliv_usagi."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4.0",
    "google-cloud-secret-manager>=2.20,<3.0",
    "google-cloud-storage>=2.18,<3.0",
    "requests>=2.32,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
usagi-analytics = "src.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
