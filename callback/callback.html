<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>usagi-analytics OAuth Callback</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 2rem;
        line-height: 1.6;
      }
      code {
        background: #f3f4f6;
        padding: 0.2rem 0.35rem;
      }
    </style>
  </head>
  <body>
    <h1>usagi-analytics OAuth Callback</h1>
    <p id="status">認可コードをCloud Runへ転送しています。</p>
    <script>
      window.USAGI_ANALYTICS_CALLBACK_URL =
        "https://YOUR_CLOUD_RUN_URL/oauth/callback";

      const status = document.getElementById("status");
      const callbackUrl = window.USAGI_ANALYTICS_CALLBACK_URL;
      const source = new URL(window.location.href);
      const target = new URL(callbackUrl);

      for (const [key, value] of source.searchParams.entries()) {
        target.searchParams.set(key, value);
      }

      if (!source.searchParams.has("code") && !source.searchParams.has("error")) {
        status.textContent = "code または error が見つかりません。TikTokのRedirect URI設定を確認してください。";
      } else if (callbackUrl.includes("YOUR_CLOUD_RUN_URL")) {
        status.innerHTML =
          "<code>callback.html</code> の <code>USAGI_ANALYTICS_CALLBACK_URL</code> をCloud Run URLへ変更してください。";
      } else {
        window.location.replace(target.toString());
      }
    </script>
  </body>
</html>
